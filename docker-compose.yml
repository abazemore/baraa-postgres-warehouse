services:
  pgdatabase:
    image: postgres:latest
    env_file: .env
    volumes:
      - "postgres_db:/var/lib/postgresql"
      - "./datasets:/var/tmp"
    networks:
      - "postgres"
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    env_file: .env
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    networks:
      - "postgres"
    ports:
      - "8085:80"

volumes:
  postgres_db:
  pgadmin_data:

networks:
  postgres: